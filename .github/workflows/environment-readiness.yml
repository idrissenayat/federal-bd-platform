name: Environment readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv and static workflow tools
        run: |
          python -m pip install uv==0.12.3 semgrep==1.172.0
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.0
      - name: Validate shell and workflow syntax
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          "$(go env GOPATH)/bin/actionlint"
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Scan repository for secrets
        run: >-
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact --exit-code 1
      - name: Run repository contract checks
        run: |
          uv sync --locked
          uv run ruff check .
          uv run mypy tests
          uv run pytest -q
          ./scripts/prove-gauntlet-blocks.sh
      - name: Scan dependencies and source
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile uv.lock .
          ./scripts/run-semgrep.sh
