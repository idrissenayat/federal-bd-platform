[extend]
useDefault = true

[[allowlists]]
description = "Ignore generated Flight Board output; source and tracked files remain scanned."
paths = [
  '''^flight-board/dist/''',
  '''^flight-board/node_modules/''',
  '''^flight-board/\.next/''',
  '''^flight-board/\.vinext/''',
  '''^flight-board/\.wrangler/''',
]

[[allowlists]]
description = "Ignore bounded public STEER work-item and UUIDv7 idempotency identities."
regexTarget = "secret"
regexes = [
  '''^RR74-[A-F0-9]{12}$''',
  '''^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$''',
]
