name: federal-bd-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: federal_bd
      POSTGRES_PASSWORD: federal_bd_local_only
      POSTGRES_USER: federal_bd
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U federal_bd -d federal_bd"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - federal_bd_postgres:/var/lib/postgresql/data

volumes:
  federal_bd_postgres:
